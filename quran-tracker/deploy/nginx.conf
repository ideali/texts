server {
    listen 80;
    server_name aniner.xyz;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aniner.xyz;

    # SSL certificates (use certbot to generate)
    ssl_certificate /etc/letsencrypt/live/aniner.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aniner.xyz/privkey.pem;

    # Quran Tracker app
    location /quran/ {
        alias /var/www/quran-tracker/;
        index index.html;
        try_files $uri $uri/ /quran/index.html;

        # Cache static assets
        location ~* \.(js|css|json|wasm)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # CORS for Web Speech API
        add_header Access-Control-Allow-Origin *;
    }

    # Other sites on the same server
    location / {
        # your existing config here
        root /var/www/html;
        index index.html;
    }
}
