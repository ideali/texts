name: Deploy Quran Tracker

on:
  push:
    branches: [main, claude/*]
    paths:
      - 'quran-tracker/web/**'
      - 'quran-tracker/deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: quran-tracker/web/
          remote_path: /var/www/quran-tracker/
          remote_host: 31.40.29.176
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Setup nginx (first deploy only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.40.29.176
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Copy nginx config if not exists
            if [ ! -f /etc/nginx/sites-available/quran ]; then
              cat > /etc/nginx/sites-available/quran << 'NGINX'
            location /quran/ {
                alias /var/www/quran-tracker/;
                index index-mobile.html index.html;
                try_files $uri $uri/ /quran/index-mobile.html;
                location ~* \.(js|css|json|wasm)$ {
                    expires 7d;
                    add_header Cache-Control "public, immutable";
                }
            }
            NGINX
              echo "Nginx config created. Add 'include sites-available/quran;' to your server block."
            fi
            # Fix permissions
            chown -R www-data:www-data /var/www/quran-tracker/ 2>/dev/null || true
            nginx -t && systemctl reload nginx 2>/dev/null || true
